<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to CampusFix — Campus Issue Reporting Platform">
    <title>Login — CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container fade-in">
            <div class="auth-card">
                <div class="auth-logo">
                    <div class="logo-icon"><i class="fa-solid fa-wrench"></i></div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your CampusFix account</p>
                </div>

                <div class="alert" id="loginAlert"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="you@college.edu" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In
                    </button>
                </form>

                <!-- Quick Demo Login Buttons -->
                <div style="margin-top:1.25rem; padding-top:1rem; border-top:1px dashed var(--color-border); text-align:center;">
                    <p style="font-size:0.8rem; color:var(--color-text-muted); margin-bottom:0.6rem;">Instant Demo Sign-In (1 Click):</p>
                    <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
                        <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('student@campusfix.in', 'student123')">
                            <i class="fa-solid fa-graduation-cap" style="color:var(--color-accent);"></i> Student
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('admin@campusfix.in', 'admin123')">
                            <i class="fa-solid fa-shield-halved" style="color:var(--color-accent);"></i> Admin
                        </button>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="quickLogin('staff@campusfix.in', 'staff123')">
                            <i class="fa-solid fa-wrench" style="color:var(--color-accent);"></i> Staff
                        </button>
                    </div>
                </div>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Sign up here</a>
                    <br><br>
                    <a href="../index.html" style="font-size:0.82rem; color:var(--color-text-muted);">
                        <i class="fa-solid fa-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            hideAlert('loginAlert');

            const btn = document.getElementById('loginBtn');
            setLoading(btn, true);

            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            const result = await api.post('auth.php?action=login', data);

            if (result.success) {
                showAlert('loginAlert', 'Login successful! Redirecting...', 'success');
                const isAdmin = ['super_admin', 'department_admin', 'staff'].includes(result.role);
                setTimeout(() => {
                    redirectTo(isAdmin ? 'admin.html' : 'dashboard.html');
                }, 800);
            } else {
                showAlert('loginAlert', result.message, 'error');
                setLoading(btn, false);
            }
        }

        function quickLogin(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
            const fakeEvent = { preventDefault: () => {} };
            handleLogin(fakeEvent);
        }

        // If already logged in, redirect unless ?switch=1 is in URL
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            if (!params.get('switch')) {
                const user = await checkAuth();
                if (user) {
                    const isAdmin = ['super_admin', 'department_admin', 'staff'].includes(user.role);
                    redirectTo(isAdmin ? 'admin.html' : 'dashboard.html');
                }
            }
        });
    </script>
</body>
</html>
