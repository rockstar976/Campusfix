<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Dashboard — CampusFix">
    <title>Dashboard — CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="../index.html" class="navbar-brand">
            <div class="logo-icon"><i class="fa-solid fa-wrench"></i></div>
            CampusFix
        </a>
        <button class="menu-toggle" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <ul class="navbar-links" id="navLinks"></ul>
        <div class="navbar-actions" id="navActions"></div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">

            <!-- Page Header -->
            <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h1>My Dashboard</h1>
                    <p>Track all your reported campus issues</p>
                </div>
                <a href="report.html" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Report Issue
                </a>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card stat-total">
                    <div class="stat-icon"><i class="fa-solid fa-clipboard-list"></i></div>
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Complaints</div>
                </div>
                <div class="stat-card stat-active">
                    <div class="stat-icon"><i class="fa-solid fa-clock"></i></div>
                    <div class="stat-value" id="statActive">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card stat-resolved">
                    <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-value" id="statResolved">0</div>
                    <div class="stat-label">Resolved</div>
                </div>
            </div>

            <!-- Complaints List -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fa-solid fa-list"></i> My Complaints</h3>
                </div>
                <div class="complaint-list" id="complaintsList">
                    <div class="spinner"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Complaint Detail Modal -->
    <div class="modal-overlay" id="complaintModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Complaint Details</h2>
                <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
