<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for CampusFix — Campus Issue Reporting Platform">
    <title>Sign Up — CampusFix</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container fade-in">
            <div class="auth-card">
                <div class="auth-logo">
                    <div class="logo-icon"><i class="fa-solid fa-wrench"></i></div>
                    <h1>Create Account</h1>
                    <p>Join CampusFix and start reporting</p>
                </div>

                <div class="alert" id="registerAlert"></div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="you@college.edu" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" placeholder="9876543210">
                        </div>
                        <div class="form-group">
                            <label for="studentId">Student / Staff ID</label>
                            <input type="text" id="studentId" class="form-control" placeholder="e.g. STU2026001">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                        <i class="fa-solid fa-user-plus"></i> Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Sign in here</a>
                    <br><br>
                    <a href="../index.html" style="font-size:0.82rem; color:var(--color-text-muted);">
                        <i class="fa-solid fa-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            hideAlert('registerAlert');

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('registerAlert', 'Passwords do not match.', 'error');
                return;
            }

            const btn = document.getElementById('registerBtn');
            setLoading(btn, true);

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                student_id: document.getElementById('studentId').value,
                password: password,
                confirm_password: confirmPassword
            };

            const result = await api.post('auth.php?action=register', data);

            if (result.success) {
                showAlert('registerAlert', 'Account created! Redirecting to login...', 'success');
                setTimeout(() => redirectTo('login.html'), 1500);
            } else {
                showAlert('registerAlert', result.message, 'error');
                setLoading(btn, false);
            }
        }
    </script>
</body>
</html>
